name: Test invalid static-checking input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action should fail with setFailed when static-checking has an invalid value
      - id: action
        uses: .
        continue-on-error: true
        with:
          static-checking: badValue
          file-url: http://localhost:19999/package.json

      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid static-checking value, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid static-checking input"
