name: Test static-checking without file-url fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # static-checking without file-url should fail with a clear error
      - id: action
        uses: .
        continue-on-error: true
        with:
          static-checking: localIsNew

      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when static-checking is set without file-url, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when static-checking used without file-url"
