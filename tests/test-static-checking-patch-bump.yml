name: Test static-checking patch version bump
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local package.json with patch-bumped version
        run: |
          # Local version 2.1.6 is a patch bump from remote 2.1.5
          echo '{"name":"test-pkg","version":"2.1.6"}' > "$GITHUB_WORKSPACE/test-patch-pkg.json"

      - id: action
        uses: .
        with:
          file-name: test-patch-pkg.json
          file-url: https://raw.githubusercontent.com/EndBug/version-check/v2.1.5/package.json
          static-checking: localIsNew

      - name: Assert changed is true
        env:
          CHANGED: ${{ steps.action.outputs.changed }}
        run: |
          echo "changed: $CHANGED"
          if [ "$CHANGED" != "true" ]; then
            echo "FAIL: expected changed=true (local 2.1.6 > remote 2.1.5)"
            exit 1
          fi
          echo "PASS: changed=true"

      - name: Assert version output
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ "$VERSION" != "2.1.6" ]; then
            echo "FAIL: expected version=2.1.6, got '$VERSION'"
            exit 1
          fi
          echo "PASS: version=2.1.6"

      - name: Assert type output is patch
        env:
          TYPE: ${{ steps.action.outputs.type }}
        run: |
          echo "type: $TYPE"
          if [ "$TYPE" != "patch" ]; then
            echo "FAIL: expected type=patch, got '$TYPE'"
            exit 1
          fi
          echo "PASS: type=patch"
