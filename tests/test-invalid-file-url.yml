name: Test invalid file-url input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Providing a non-URL string as file-url should cause the action to fail
      - id: action
        uses: .
        continue-on-error: true
        with:
          file-url: not-a-valid-url

      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid file-url, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid file-url input"
