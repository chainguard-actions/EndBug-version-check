name: Test static-checking same version (no change)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create local package.json matching remote version
        run: |
          # Remote is 2.1.5 (action's own package.json at v2.1.5 tag)
          # Local also 2.1.5 => no version change
          echo '{"name":"test-pkg","version":"2.1.5"}' > "$GITHUB_WORKSPACE/test-same-pkg.json"

      - id: action
        uses: .
        with:
          file-name: test-same-pkg.json
          file-url: https://raw.githubusercontent.com/EndBug/version-check/v2.1.5/package.json
          static-checking: localIsNew

      - name: Assert changed is false
        env:
          CHANGED: ${{ steps.action.outputs.changed }}
        run: |
          echo "changed: $CHANGED"
          if [ "$CHANGED" != "false" ]; then
            echo "FAIL: expected changed=false (local 2.1.5 == remote 2.1.5)"
            exit 1
          fi
          echo "PASS: changed=false"

      - name: Assert version output is empty (no change detected)
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: '$VERSION'"
          # When no change, version output is not set
          if [ -n "$VERSION" ]; then
            echo "FAIL: expected version to be empty when no change, got '$VERSION'"
            exit 1
          fi
          echo "PASS: version is empty as expected"
